<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Inventario</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1f2430; --muted:#8a909c; --soft:#5d6472; --line:#eceef2; --line2:#f4f5f7;
  --brand:#1a56db; --brand-s:#eaf1fe; --ok:#0e9f6e; --ok-s:#e6f6f0; --warn:#c27803; --warn-s:#fdf6e7; --bad:#e02424; --bad-s:#fdecec;
  --PPM:0.74px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 .logo{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
header h1 small{font-weight:500;color:var(--muted);font-size:12px}
#cuentaBox{margin-left:auto;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px}
#cuentaBox:empty{display:none}
#cuentaBox .cn{display:flex;flex-direction:column;line-height:1.15}#cuentaBox .cn b{font-size:12.5px}#cuentaBox .cn span{font-size:11px;color:var(--muted)}
#cuentaBox .av{width:28px;height:28px;border-radius:50%;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:11px}
#cuentaBox button{border:1px solid var(--line);background:#f7f8fa;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink)}
body:not(.admin) #usr{display:none!important}
#usr:empty,body.modo-desc #usr{display:none!important}
#usr{flex:0 1 340px;min-width:0;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink);display:flex;align-items:center;gap:9px;text-align:left}
#usr .av,.who .av{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:11.5px}
#usr .tx{flex:1;min-width:0}#usr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#usr .cd{font-size:11px;color:var(--muted)}#usr .ch{color:var(--muted);font-size:11px}
#login{position:fixed;inset:0;z-index:600;background:#eef1f5;display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
body.sin-sesion header,body.sin-sesion main,body.sin-sesion section,body.sin-sesion #who,body.sin-sesion #modal,body.sin-sesion #avisoEnt{display:none!important}
#login .lg{background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(16,24,40,.14);padding:26px 24px;width:100%;max-width:370px;display:flex;flex-direction:column}
#login .lgT{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700}#login .lgT .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px}
#login .lgS{margin:4px 0 18px;color:var(--muted);font-size:12.5px}
#login label{font-size:12.5px;font-weight:600;margin:0 0 5px}
#login input{padding:11px 12px;border:1px solid #c9ced8;border-radius:10px;font-size:16px;margin-bottom:12px}
#login input:focus{outline:none;border-color:var(--brand)}
#lgL{margin:-6px 0 10px;display:flex;flex-direction:column;gap:5px}#lgL button{text-align:left;border:1px solid var(--line);background:#f7f8fa;border-radius:9px;padding:8px 10px;font-size:13px;cursor:pointer}
#lgL button.on{border-color:var(--brand);background:#eaf2ff;font-weight:600}
#lgE{color:var(--bad);font-size:12.5px;min-height:16px;margin:-4px 0 8px}
#login .b1{padding:12px;font-size:15px}#login .lgN{margin:12px 0 0;font-size:11.5px;color:var(--muted);text-align:center}
#who{position:fixed;inset:0;z-index:160;background:rgba(16,24,40,.28);display:none}
#who .in{position:absolute;width:390px;max-width:calc(100vw - 20px);max-height:78vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(16,24,40,.28);padding:14px 14px 10px}
#who h2{font-size:15px;margin:2px 0 2px}#who p{color:var(--muted);margin:0 0 10px;font-size:12px}
#who input{width:100%;padding:9px 12px;position:sticky;top:0;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;margin-bottom:12px}
#who input:focus{outline:none;border-color:var(--brand)}
.who{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:5px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.who:hover{border-color:var(--brand)}
.who .tx{flex:1;min-width:0}.who .nm{font-weight:600}.who .cd{font-size:11.5px;color:var(--muted)}
.who .st{font-size:11px;border-radius:6px;padding:2px 7px;background:var(--line2);color:var(--soft);white-space:nowrap}.who .st.ok{background:var(--ok-s);color:var(--ok)}
.who.off{opacity:.55}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;flex:1 1 240px;max-width:380px}
@media (max-width:1500px){header h1 small{display:none}}
.prog{min-width:0}
.pill{background:var(--line2);color:var(--soft);border-radius:6px;padding:5px 9px;font-size:12px;white-space:nowrap;font-weight:500}
.pill b{color:var(--ink);font-weight:700}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.ok b{color:var(--ok)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.hbtn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 13px;font-weight:600;font-size:12.5px}
.hbtn.wa{background:#1fa855}
.hbtn.sec{background:#fff;color:var(--soft);border:1px solid var(--line);padding:8px 11px}
main{display:grid;grid-template-columns:430px 1fr;gap:14px;padding:14px 18px}
#side{background:var(--card);border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 86px);position:sticky;top:70px;overflow:hidden}
#side .top{padding:12px 12px 8px}
#side .top h2{font-size:13px;margin:0 0 8px;font-weight:600}
#q{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--line2)}
#q:focus{outline:none;border-color:var(--brand);background:#fff}
#hint{font-size:11px;color:var(--muted);margin-top:7px}
#pal{overflow:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:5px}
.pcard{border-radius:8px;padding:7px 9px 7px 12px;background:#fff;border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:pan-y;position:relative;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;cursor:grab}
.pcard::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--c)}
.pcard:hover{border-color:#d9dde4;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.pcard .n{font-weight:600;font-size:12px;line-height:1.25}
.pcard .m{font-size:11px;color:var(--muted);grid-column:1}
.pcard .f{grid-row:1/3;grid-column:2;font-weight:600;font-size:11px;color:var(--soft);background:var(--line2);border-radius:5px;padding:2px 6px}
.pcard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-s)}
.pcard.done{opacity:.5;cursor:default}.pcard.done .f{color:var(--ok);background:var(--ok-s)}
.sec-t{font-size:10.5px;color:var(--muted);margin:10px 2px 3px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
#calwrap{background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden;min-width:0}
.nav{display:flex;align-items:center;gap:6px;padding:10px 12px}
.nav .t{flex:1;font-weight:600;font-size:14px}
.nbtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;font-size:16px;color:var(--soft);line-height:1}
#strip{display:flex;gap:3px;overflow-x:auto;padding:0 12px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:34px;border-radius:8px;padding:3px 0 6px;text-align:center;font-size:9.5px;color:var(--muted);position:relative;text-transform:uppercase;letter-spacing:.3px;cursor:pointer}
.chip b{display:block;font-size:13px;color:var(--ink);font-weight:600;letter-spacing:0}
.chip.on{background:var(--brand)}.chip.on,.chip.on b{color:#fff}
.chip.off b{color:#c5c9d1}
.chip.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--brand)}
.chip.on.has::after{background:#fff}
.chip.err::after{background:var(--bad)!important}
.chip.drop{box-shadow:0 0 0 2px var(--brand)}
#cal{display:flex;overflow-x:auto}
.hours{flex:0 0 42px;position:relative}
.hours div{position:absolute;right:7px;font-size:9.5px;color:var(--muted);transform:translateY(-6px);font-variant-numeric:tabular-nums}
.day{flex:1 1 0;min-width:120px;border-left:1px solid var(--line)}
.dh{height:44px;padding:5px 6px 0;text-align:center}
.dh .dw{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.dh b{font-size:15px;font-weight:600}
.dh .tag{display:inline-block;font-size:8.5px;border-radius:4px;padding:1px 4px;margin-left:4px;color:#7e3af2;background:#f3ebfe;font-weight:600;letter-spacing:0;text-transform:none}
.dh .hrs{font-size:10px;color:var(--muted);margin-left:5px;font-weight:500}
.dcol{position:relative;border-top:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent calc(var(--PPM)*60))}
.blocked{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#f7f8fa,#f7f8fa 5px,#fff 5px,#fff 10px);color:#b4b9c2;font-size:9.5px;text-align:center;padding-top:5px;pointer-events:none}
.blocked.meet{background:#f7f2fe;color:#7e3af2;font-weight:600}
.vis{position:absolute;left:3px;right:4px;border-radius:5px;background:var(--cb);border-left:3px solid var(--c);padding:2px 5px;font-size:10.5px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab;line-height:1.2}
.vis:hover{filter:brightness(.97)}
.vis .n{font-weight:600;line-height:1.2;word-break:break-word}.vis .n .h{font-weight:500;margin-right:4px}
.vis .h{color:var(--soft);font-size:9.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.vis.bad{box-shadow:inset 0 0 0 1.5px var(--bad)}
.gap{position:absolute;left:6px;right:6px;font-size:8.5px;color:#b0b5be;text-align:center;pointer-events:none;line-height:1}
.gap.w{color:var(--warn);font-weight:600}
.prev{position:absolute;left:3px;right:4px;border-radius:5px;border:1.5px dashed var(--brand);background:rgba(26,86,219,.07);pointer-events:none;font-size:10px;padding:2px 5px;color:var(--brand);font-weight:600}
.prev.no{border-color:var(--bad);background:rgba(224,36,36,.06);color:var(--bad)}
#ghost{position:fixed;z-index:100;pointer-events:none;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;box-shadow:0 8px 24px rgba(16,24,40,.18);border-left:3px solid var(--c);background:#fff;max-width:280px;display:none}
#probs{border-top:1px solid var(--line);font-size:12px}
#probs summary{padding:9px 12px;cursor:pointer;font-weight:600;color:var(--soft);list-style:none}
#probs summary::-webkit-details-marker{display:none}
#probs summary .c{background:var(--bad-s);color:var(--bad);border-radius:5px;padding:1px 6px;margin-left:6px}
#probs summary .w{background:var(--warn-s);color:var(--warn);border-radius:5px;padding:1px 6px;margin-left:6px}
#probs .lst{padding:0 12px 10px;max-height:200px;overflow:auto}
#probs .p{padding:4px 0;cursor:pointer;border-top:1px solid var(--line2);color:var(--soft)}
#probs .p b{color:var(--ink);font-weight:600}
#probs .p.bad::before{content:"●";color:var(--bad);margin-right:6px}#probs .p.warn::before{content:"●";color:var(--warn);margin-right:6px}
#probs .okm{color:var(--ok);font-weight:500}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 14px;border-radius:9px;z-index:200;font-size:12.5px;display:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(16,24,40,.2)}
#modal{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
#modal h3{margin:0 0 4px;font-size:15px}
#modal .row{display:flex;gap:10px;margin:12px 0}
#modal label{flex:1;font-size:11px;color:var(--muted);font-weight:500}
#modal input,#modal select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;margin-top:4px;color:var(--ink)}
#modal .err{color:var(--bad);font-size:12px;min-height:16px}
#modal .acts{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
.b1{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.b2{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--soft)}
.b3{background:#fff;border:1px solid #f6caca;color:var(--bad);border-radius:8px;padding:8px 14px}
.sw{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
.sw input{width:18px;height:18px}
body.dragging,body.dragging *{cursor:grabbing!important}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.secc{display:flex;gap:2px;background:#eef1f5;border-radius:9px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}.secc::-webkit-scrollbar{display:none}.secc button{flex:none}
.secc button{border:0;background:none;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer}
.secc button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.solo-panel{display:none}
body:not(.admin) .solo-admin{display:none!important}
body.modo-equipo main,body.modo-equipo #stats,body.modo-equipo #undo,body.modo-equipo #save,body.modo-equipo #dl,body.modo-equipo #exp,body.modo-equipo #menu,body.modo-equipo #guia,body.modo-equipo #usr,
body.modo-desc main,body.modo-desc #stats,body.modo-desc #undo,body.modo-desc #save,body.modo-desc #dl,body.modo-desc #exp,body.modo-desc #menu,body.modo-desc #guia{display:none!important}
#mesSec{padding:18px;max-width:760px;margin:0 auto}
#mesSec .mesT{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 14px}#mesSec .mesT h2{margin:0;font-size:20px}#mesSec .mesT span{font-size:12.5px;color:var(--muted)}
#mesSec .mesL{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 18px;position:relative}
#mesSec .mesP{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f0f2f5;position:relative}#mesSec .mesP:last-child{border-bottom:0}
#mesSec .mesN{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;background:#fff}
#mesSec .mesP.ok .mesN{background:var(--ok);border-color:var(--ok);color:#fff}
#mesSec .mesX{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}#mesSec .mesX b{font-size:14.5px}#mesSec .mesX span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mesSec .mesB button{min-width:150px;padding:9px 14px}#mesSec .mesB button:disabled{opacity:.4}
#mesSec .mesF{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:560px){#mesSec .mesB button{min-width:0}}
#mesSec .paso{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
#mesSec .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
#mesSec .paso h3{margin:0 0 3px;font-size:15px}#mesSec .paso p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}#mesSec .paso .est{font-size:12px;color:var(--ok);font-weight:600;margin-bottom:8px}
#descSec,#equipoSec{padding:14px 18px;max-width:1080px;margin:0 auto}
#convSec{padding:14px 14px 40px;max-width:1080px;margin:0 auto}
#envSec{padding:14px 14px 40px;max-width:1180px;margin:0 auto}
#envSec .enT{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}#envSec .enT h2{margin:0;font-size:20px}#envSec .enT span{font-size:12.5px;color:var(--muted)}
#envSec .enBar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
#envSec .enBar label{font-weight:700}#envSec .enBar select{min-width:150px}#envSec .enBar .lnk{font-size:12.5px}#envSec .enBar select{padding:10px 12px;border:1px solid #c9ced8;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;min-width:230px}
#envSec .enBar .sep{flex:1}#envSec .enRes{font-size:13px;color:var(--soft)}#envSec .enAy{margin:8px 4px 12px;font-size:12.5px}
.enVer{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#f3f5f9}.enVer img{width:100%;display:block}
#envSec .enWa{background:#1fa855;border-color:#1fa855}
.srP{display:flex;gap:12px;align-items:center;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}.srP b{display:block;font-size:15px}.srP span{font-size:12.5px;color:var(--muted)}
.srP .enAv{flex:none;width:40px;height:40px;border-radius:50%;background:#e8eefb;color:#1f3a5f;display:grid;place-items:center;font-weight:800}
.srPasos{margin:0 0 10px;padding-left:20px;font-size:13.5px;line-height:1.6}.srBar{height:6px;border-radius:9px;background:#eef1f5;overflow:hidden;margin-bottom:6px}.srBar i{display:block;height:100%;background:#1fa855}
#envSec .enAcc,#mbox .enAcc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.enAcc button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;text-align:left;font-size:14px;font-weight:700}.enAcc button small{font-weight:500;font-size:11.5px;opacity:.85}
@media (max-width:760px){.enAcc{grid-template-columns:1fr!important}}
#mbox.cvGrande{max-width:960px;width:96vw}#mbox .enBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#mbox .enBar select{padding:8px 10px;border:1px solid #c9ced8;border-radius:9px;font-family:inherit}
#mbox .enT h2{margin:0 0 2px;font-size:19px}#mbox .enT span{font-size:12.5px;color:var(--muted)}#mbox .enC{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}#mbox .enH{display:flex;justify-content:space-between;padding:10px 12px;color:#fff;background:linear-gradient(90deg,#1f3a5f,#2b5ea8)}

  for (const [c, ls] of Object.entries(por)) if (ls.length > 1) { const tp = invTok(pts[c]); const mp = (D.inv || {}).mapeo || {}, q = l => { const k = invTok(l), i = [...k].filter(w => tp.has(w)).length; return (mp[cad + '|' + invNorm(l)] ? 1e6 : 0) + i * 100 - (k.size - i) + (/BOGOTA/.test(invNorm(l)) ? 0.5 : 0); }; ls.sort((a, b) => q(b) - q(a) || (a < b ? -1 : 1)); ls.slice(1).forEach(l => delete res[l]); }
  return res;
}
function invNombreLugar(d, h) {                        // «Nombre Lugar» a veces viene recortado: el «Código interno Almacén» trae el nombre completo
  d = String(d || '').replace(/\s+/g, ' ').trim(); h = String(h || '').replace(/\s+/g, ' ').trim();
  return d && h && d.length > h.length && d.toUpperCase().startsWith(h.toUpperCase()) ? d : (h || d);
}
async function invLeerArchivo(file) {
  const L = await leerLibro(new Uint8Array(await file.arrayBuffer())), hoja = Object.values(L.hojas)[0];
  const xml = await L.zip.file(hoja).async('string'), out = { archivo: file.name, emisor: '', fecha: '', filas: [] };
  let ini = false;
  for (const m of xml.matchAll(/<row [^>]*>([\s\S]*?)<\/row>/g)) {
    const c = celdas(m[0], L.ss), a = String(c.A ?? '').trim();
    if (!ini) {
      const n = invNorm(a);
      if (n.startsWith('EMISOR')) out.emisor = String(c.B || '');
      else if (n.startsWith('FECHA INICIO')) { const f = String(c.D || c.B || ''), k = f.match(/(\d\d)-(\d\d)-(\d{4})/); if (k) out.fecha = `${k[3]}-${k[2]}-${k[1]}`; }
      else if (n.startsWith('CODIGO DE PRODUCTO')) ini = true;
      continue;
    }
    if (!/^\d{6,14}$/.test(a)) continue;
    const q = parseFloat(String(c.E).replace(',', '.')); if (!isFinite(q) || Math.abs(q) > 1e7) continue;
    out.filas.push([a, String(c.B || '').replace(/�/g, '').trim(), invNombreLugar(c.D, c.H), q]);
  }
  if (!out.fecha) { const k = file.name.match(/_(\d{4})(\d\d)(\d\d)\d{6,}/); if (k) out.fecha = `${k[1]}-${k[2]}-${k[3]}`; }

}
async function invSubir(files) {
  if (typeof JSZip === 'undefined') { avisar('Para leer el archivo necesitas internet (la primera vez).'); return; }

    if (vistos.has(base + '|' + f.size)) { msg.push('• ' + f.name + ': copia repetida, no se sumó'); continue; }
    vistos.add(base + '|' + f.size);
    if (!/\.xlsx$/i.test(f.name) || f.size < 200 || f.size > 60e6) { msg.push('✖ ' + f.name + ': no es un Excel de inventario del CEN'); continue; }

    let r; try { r = await invLeerArchivo(f); } catch (e) { msg.push('✖ ' + f.name + ': ' + (/central directory|zip|corrupt|signature/i.test(e.message) ? 'el archivo está dañado o no es un Excel (.xlsx)' : e.message)); continue; }
    nOk++;
    const cad = invCadDe(r.emisor), pts = {};
    for (const [cod, p] of Object.entries(D.pdv)) if (String(p[1]).toUpperCase() === cad) pts[cod] = p[0];
    const m = invCruzar(cad, [...new Set(r.filas.map(x => x[2]))], pts), nuevo = {}, ced = {};
    for (const [e, d, lug, q] of r.filas) {
      if (d && !B.prod[e] && !(D.inv && D.inv.prod && D.inv.prod[e])) B.prod[e] = [d, '', 'Otros'];
      if (invEsCedi(lug) && (!Object.keys(m).length || /\b(CALI|CLO|BARRANQUILLA|MEDELLIN|BUCARAMANGA|CARTAGENA|CUCUTA|PEREIRA|VEGAS)\b/.test(invNorm(lug)))) continue;   // bodegas de otra regional
      if (invEsCedi(lug)) { const b = ced[lug.replace(/\s+/g, ' ')] = ced[lug.replace(/\s+/g, ' ')] || {}; b[e] = Math.round(((b[e] || 0) + q) * 100) / 100; continue; }
      const cod = m[lug]; if (!cod) continue; const z = nuevo[cod] = nuevo[cod] || {}; z[e] = Math.round(((z[e] || 0) + q) * 100) / 100;
    }
    for (const [cod, q] of Object.entries(nuevo)) {
      const ant = B.pts[cod] || (D.inv && D.inv.pts && D.inv.pts[cod]);
      B.pts[cod] = ant && ant.f < r.fecha ? { f: r.fecha, q, fa: ant.f, qa: ant.q } : ant && ant.f === r.fecha ? Object.assign({}, ant, { q: Object.assign({}, ant.q, q) }) : { f: r.fecha, q };
    }

    const nu = Object.keys(nuevo).length, tot = Object.keys(pts).length;
    B.fuentes = B.fuentes.filter(x => x.archivo !== f.name && x.archivo !== base).concat([{ cadena: cad, fecha: r.fecha, archivo: f.name, lugares: new Set(r.filas.map(x => x[2])).size, nuestros: nu }]);
    msg.push((nu ? '✔ ' : '• ') + bonito(cad) + ' · ' + invFecha(r.fecha) + ': ' + (nu ? nu + ' de tus ' + tot + ' puntos' : 'ninguno de tus puntos (es de otra regional)'));
  }

  try { localStorage.setItem(INV_K, JSON.stringify(B)); } catch (e) { avisar('No pude guardar el inventario en este equipo (espacio lleno).'); return; }
  invMemo = null; invRef.c = null; pintarInv();
  avisar(msg.join('\n') + '\n\nQueda guardado en este equipo. Para que el equipo lo vea en su celular, deja el archivo en Descargas: se publica en la actualización de la noche.');
}
// --- 🔗 enlace temporal de inventario (12 h): solo inventario, firmado por el coordinador, se vence solo ---
const INV_HORAS = 6;
const invB64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
async function invArmarEnlace(u) {                      // enlace corto, solo letras y números: …/i/#<id><secreto><persona><vence>
