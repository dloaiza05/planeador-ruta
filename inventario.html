<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Inventario · enlace temporal</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2430;--muted:#8a909c;--soft:#5d6472;--line:#eceef2;--brand:#1a56db;--ok:#0e9f6e;--ok-s:#e6f6f0;--warn:#c27803;--warn-s:#fdf6e7;--bad:#e02424;--bad-s:#fdecec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:linear-gradient(90deg,#1f3a5f,#2b5ea8);color:#fff;padding:14px 16px}header h1{margin:0;font-size:19px}header p{margin:3px 0 0;font-size:12.5px;opacity:.9}
main{max-width:860px;margin:0 auto;padding:12px 14px 40px}
.vence{background:var(--warn-s);border:1px solid #f1d39b;color:#7a4b00;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
input{width:100%;padding:10px 12px;border:1px solid #c9ced8;border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
.ley{font-size:12px;color:var(--soft);margin:0 0 10px}
.pt{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.pt>button{all:unset;display:block;width:100%;padding:10px 12px;cursor:pointer;box-sizing:border-box}
.pt b.n{font-size:15px}.pt .s{display:block;font-size:12px;color:var(--muted)}.pt .h{display:block;font-size:12.5px;color:var(--ok);font-weight:700}
em{font-style:normal;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-right:4px;display:inline-block;margin-top:3px}
em.r{background:var(--bad-s);color:var(--bad)}em.a{background:var(--warn-s);color:var(--warn)}em.n{background:#f1eafe;color:#6d28d9}em.w{background:#f1f3f6;color:#4b5563}
.det{border-top:1px solid var(--line);padding:6px 12px 10px}.det h4{margin:10px 0 2px;font-size:13.5px}
.f{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f4f5f7}.f b{font-size:13.5px}.f span{display:block;font-size:12px;color:#374151}
.q{flex:none;display:flex;gap:4px}.c{min-width:66px;text-align:center;background:#f4f6f9;border-radius:8px;padding:3px 6px}.c small{display:block;font-size:10px;color:var(--muted)}.c b{font-size:15px}
.c.r{background:var(--bad-s)}.c.r b{color:var(--bad)}.c.a{background:var(--warn-s)}.c.a b{color:var(--warn)}
.marcas{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.marcas span{background:var(--ok-s);border-radius:20px;padding:2px 9px;font-size:12px}
.err{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:12px}
</style>
</head>
<body>
<header><h1>📦 Inventario Haleon</h1><p id="sub">Enlace temporal de solo lectura</p></header>
<main id="app"><div class="err">Abriendo…</div></main>
<footer>Enlace temporal de solo lectura · Canal Directo Bogotá · Fuente: reportes de inventario del CEN Carvajal</footer>
<script>
const PUB = {"key_ops": ["verify"], "ext": true, "kty": "EC", "x": "9m_qmv7brF34K4tDzWUrm_u2D0IiC5eg41OnzOl8emk", "y": "RnuWNRhfbjKoVZBYfcmKEvmsf286zGKtUqPYf3U-ceY", "crv": "P-256"};
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const num = q => (Math.round(q * 10) / 10).toLocaleString('es-CO');
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const EST = [['r', '🔴 Agotado (la cadena lo reporta en cero)'], ['w', '⚪ No aparece en el reporte (revisar en la visita)'], ['a', '🟠 Por agotarse'], ['n', '🟣 Error de inventario (pedir ajuste)'], ['', '✅ Con inventario']];
function falla(t) { $('#app').innerHTML = `<div class="err"><h2>🔒 ${esc(t)}</h2><p>Pídele al coordinador un enlace nuevo.</p></div>`; }
(async () => {
  try {
    const h = location.hash.slice(1), [d, s] = h.split('.');
    if (!d || !s || !PUB) return falla('Enlace incompleto');
    const k = await crypto.subtle.importKey('jwk', PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    const datos = b64u(d), ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, b64u(s), datos);
    if (!ok) return falla('Este enlace no es válido (fue modificado)');
    const txt = await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(), X = JSON.parse(txt);
    if (!X.exp || Date.now() > X.exp) return falla('Este enlace venció');
    history.replaceState(null, '', location.pathname + '#' + h);           // no queda en el historial de otras páginas
    pintar(X);
    setInterval(() => { if (Date.now() > X.exp) falla('Este enlace venció'); }, 60000);
  } catch (e) { falla('No se pudo abrir el enlace'); }
})();
function pintar(X) {
  const vence = new Date(X.exp), horas = Math.max(0, Math.round((X.exp - Date.now()) / 36e5 * 10) / 10);
  $('#sub').textContent = (X.para || 'Equipo') + ' · ' + Object.entries(X.fu || {}).map(([c, f]) => c + ' ' + f).join(' · ');
  let filtro = '';
  const dibujar = () => {
    const q = filtro.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const L = X.pts.filter(p => !q || (p.n + ' ' + p.c + ' ' + (p.m || '') + ' ' + p.it.map(i => i[0]).join(' ')).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
    $('#lst').innerHTML = L.map((p, i) => {
      const cnt = [0, 0, 0, 0]; for (const it of p.it) if (it[1] < 4) cnt[it[1]]++;
      return `<div class="pt"><button data-i="${X.pts.indexOf(p)}"><b class="n">${esc(p.n)}</b><span class="s">${esc(p.c)}${p.m ? ' · ' + esc(p.m) : ''} · inventario del ${esc(p.f)} · lo surte ${esc(p.ce || '—')}</span>
        <span class="h">✅ ${p.s} productos con inventario · ${p.u.toLocaleString('es-CO')} unidades</span>${cnt[0] ? `<em class="r">🔴 ${cnt[0]} agotados</em>` : ''}${cnt[1] ? `<em class="w">⚪ ${cnt[1]} no aparecen</em>` : ''}${cnt[2] ? `<em class="a">🟠 ${cnt[2]} por agotarse</em>` : ''}${cnt[3] ? `<em class="n">🟣 ${cnt[3]} errores</em>` : ''}</button><div class="det" hidden></div></div>`;
    }).join('') || '<p class="ley">Nada con ese filtro.</p>';
    document.querySelectorAll('#lst .pt>button').forEach(b => b.onclick = () => { const d = b.nextElementSibling; if (!d.hidden) { d.hidden = true; return; } d.innerHTML = detalle(X.pts[+b.dataset.i]); d.hidden = false; });
  };
  const detalle = p => {
    const g = [0, 1, 3, 2, 4].map(k => [k, p.it.filter(i => i[1] === k)]).filter(([, l]) => l.length);
    return `${p.mc && p.mc.length ? `<div class="marcas">${p.mc.map(([m, u, n]) => `<span><b>${esc(m)}</b> ${u.toLocaleString('es-CO')} u · ${n} ref.</span>`).join('')}</div>` : ''}` +
      g.map(([k, l]) => `<h4>${EST[k][1]} <small>(${l.length})</small></h4>` + l.map(i => `<div class="f"><div><b>${esc(i[0])}</b>${i[4] ? `<span>${esc(i[4])}</span>` : ''}</div><div class="q"><div class="c ${k === 0 ? 'r' : k === 2 ? 'a' : ''}"><small>En ${esc(p.n.slice(0, 20))}</small><b>${i[1] === 1 ? 'sin dato' : num(i[2])}</b></div><div class="c"><small>En ${esc(p.ce || 'el CEDI')}</small><b>${i[3] == null ? '—' : num(i[3])}</b></div></div></div>`).join('')).join('') +
      (X.solo ? '<p class="ley">Este enlace muestra solo lo que hay que revisar en cada punto.</p>' : '');
  };
  $('#app').innerHTML = `<div class="vence">⏳ Este enlace vence el <b>${vence.toLocaleString('es-CO', { weekday: 'long', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</b> (quedan unas ${horas} h). Después ya no abre.</div>
    <input id="q" type="search" placeholder="Buscar punto o producto…"><p class="ley">Toca un punto para ver su inventario. 🔴 agotado · ⚪ no aparece en el reporte · 🟠 por agotarse · 🟣 error de inventario. «En el CEDI» = bodega central de la cadena.</p><div id="lst"></div>`;
  $('#q').oninput = e => { filtro = e.target.value; dibujar(); };
  dibujar();
}
</script>
</body>
</html>
