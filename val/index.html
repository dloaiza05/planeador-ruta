<script>
(async () => {
  const X = JSON.parse(document.getElementById('x').textContent), S = crypto.subtle, ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const bu = b => { const u = new Uint8Array(b); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
  const $ = id => document.getElementById(id), K = 'acc-' + X.s.slice(0, 8);
  const abrir = async k => {
    const z = await S.decrypt({ name: 'AES-GCM', iv: ub(X.i) }, k, ub(X.c));
    const html = await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    try { sessionStorage.setItem('planeador-admin', '1'); localStorage.setItem('planeador-cuenta', ($('u') ? $('u').value : '').toUpperCase().trim() || localStorage.getItem('planeador-cuenta') || ''); } catch (e) { }
    document.open(); document.write(html); document.close();
  };
  try { const g = localStorage.getItem(K); if (g) { await abrir(await S.importKey('raw', ub(g), 'AES-GCM', true, ['decrypt'])); return; } } catch (e) { try { localStorage.removeItem(K); } catch (e2) { } }
  let fallos = 0, espera = 0;
  $('f').onsubmit = async ev => {
    ev.preventDefault(); $('e').textContent = '';
    if (Date.now() < espera) { $('e').textContent = 'Espera ' + Math.ceil((espera - Date.now()) / 1000) + ' segundos.'; return; }
    const c = ($('u').value + $('p').value).toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!$('u').value || !$('p').value) { $('e').textContent = 'Escribe usuario y clave.'; return; }
    $('b').disabled = true; $('b').textContent = '…';
    try {
      const base = await S.importKey('raw', new TextEncoder().encode(c), 'PBKDF2', false, ['deriveKey']);
      const k = await S.deriveKey({ name: 'PBKDF2', salt: ub(X.s), iterations: X.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      try { await S.decrypt({ name: 'AES-GCM', iv: ub(X.i) }, k, ub(X.c)); } catch (e) { fallos++; if (fallos >= 5) { espera = Date.now() + 15000 * (fallos - 4); } $('e').textContent = 'Usuario o clave incorrectos.'; return; }
      if ($('r').checked) try { localStorage.setItem(K, bu(await S.exportKey('raw', k))); } catch (e) { }
      await abrir(k);
    } catch (e) { $('e').textContent = 'No se pudo abrir.'; }
    finally { const b = $('b'); if (b) { b.disabled = false; b.textContent = 'Entrar'; } }
  };
})();
</script>
